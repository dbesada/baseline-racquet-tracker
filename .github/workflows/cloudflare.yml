name: Cloudflare

# Baseline on Cloudflare (free plans), replacing the NAS:
#   site    builds the static site and deploys the Worker (cloudflare/) on
#           every merge to main, or by hand.
#   prices  every 3 hours (or by hand): runs the price check, publishes the
#           dashboard and buy links, and sends price alerts. "publish" only
#           rebuilds the dashboard from the last check with the current
#           settings (the admin site starts it after a settings change).
# Both stay off until the repository variable CLOUDFLARE_ACCOUNT_ID is set
# (after the CLOUDFLARE_API_TOKEN secret exists).

on:
  push:
    branches: [main]
  # Fallback only: the Cloudflare Worker's Cron Trigger starts the 3-hourly
  # check. A scheduled run skips the price check and alerts when the last check is under
  # 2 hours old, but still republishes, so a settings change it replaced in the
  # queue is not lost.
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: What to run
        type: choice
        options: [prices, publish, site, both]
        default: prices
      force_model_audit:
        description: Also re-check the official model catalogues
        type: boolean
        default: false

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  KV_NAMESPACE_ID: 0f0620ab764b40c9954553d68876617d
  WRANGLER: npx wrangler --config cloudflare/wrangler.jsonc

jobs:
  site:
    if: vars.CLOUDFLARE_ACCOUNT_ID != '' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.job == 'site' || inputs.job == 'both')))
    runs-on: ubuntu-latest
    concurrency: cloudflare-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:static
      - name: Create or update the D1 tables
        run: $WRANGLER d1 execute baseline --remote --file cloudflare/schema.sql
      - name: Deploy the Worker and static site
        env:
          BASELINE_VAPID_KEYS: ${{ secrets.BASELINE_VAPID_KEYS }}
        run: |
          PUBLIC_KEY=$(node -e 'console.log(JSON.parse(process.env.BASELINE_VAPID_KEYS).publicKey)')
          $WRANGLER deploy --var "PUSH_PUBLIC_KEY:$PUBLIC_KEY"
      - name: Give the admin site its GitHub token
        env:
          DISPATCH_TOKEN: ${{ secrets.BASELINE_DISPATCH_TOKEN }}
        if: env.DISPATCH_TOKEN != ''
        run: printf '%s' "$DISPATCH_TOKEN" | $WRANGLER secret put GITHUB_DISPATCH_TOKEN

  prices:
    if: vars.CLOUDFLARE_ACCOUNT_ID != '' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.job != 'site'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # A publish waits for a running check instead of being dropped.
    concurrency:
      group: cloudflare-prices
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Wrangler reads the config, whose static-asset folder must exist.
      - run: mkdir -p .data out dist/client
      - name: Load the last price check and the owner's settings
        run: |
          $WRANGLER kv key get monitor-state.json --namespace-id "$KV_NAMESPACE_ID" --remote > .data/baseline-monitor.json || rm -f .data/baseline-monitor.json
          node -e 'JSON.parse(require("fs").readFileSync(".data/baseline-monitor.json","utf8"))' 2>/dev/null || rm -f .data/baseline-monitor.json
          $WRANGLER kv key get settings.json --namespace-id "$KV_NAMESPACE_ID" --remote > .data/baseline-settings.json || rm -f .data/baseline-settings.json
          node -e 'JSON.parse(require("fs").readFileSync(".data/baseline-settings.json","utf8"))' 2>/dev/null || rm -f .data/baseline-settings.json
      - name: Skip a scheduled run when a recent check exists
        id: fresh
        if: github.event_name == 'schedule'
        run: |
          node -e '
            let age = Infinity;
            try { age = Date.now() - Date.parse(JSON.parse(require("fs").readFileSync(".data/baseline-monitor.json", "utf8")).checkedAt); } catch {}
            const skip = age < 2 * 60 * 60 * 1000;
            console.log(skip ? "Last check is recent: skipping the price check, republishing only." : "No recent check; running the fallback check.");
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "skip=" + skip + "\n");
          '
      - name: Check prices
        if: steps.fresh.outputs.skip != 'true' && (github.event_name == 'schedule' || inputs.job != 'publish')
        run: node scripts/check-prices.mjs
        env:
          BASELINE_SETTINGS_FILE: .data/baseline-settings.json
          BASELINE_URL: http://127.0.0.1:9
          BASELINE_FORCE_MODEL_AUDIT: ${{ inputs.force_model_audit && '1' || '' }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
          MARKETPLACE_BROWSER_URL: ${{ secrets.MARKETPLACE_BROWSER_URL }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      - name: Build the dashboard and buy links
        run: node scripts/publish-cloudflare.mjs .data/baseline-monitor.json .data/baseline-settings.json out
      - name: Publish
        run: |
          $WRANGLER d1 execute baseline --remote --file out/offers.sql
          $WRANGLER kv key put dashboard.json --path out/dashboard.json --namespace-id "$KV_NAMESPACE_ID" --remote
          $WRANGLER kv key put dashboard-admin.json --path out/dashboard-admin.json --namespace-id "$KV_NAMESPACE_ID" --remote
          $WRANGLER kv key put operations.json --path out/operations.json --namespace-id "$KV_NAMESPACE_ID" --remote
          $WRANGLER kv key put monitor-state.json --path .data/baseline-monitor.json --namespace-id "$KV_NAMESPACE_ID" --remote
      - name: Send price alerts
        if: steps.fresh.outputs.skip != 'true' && (github.event_name == 'schedule' || inputs.job != 'publish')
        env:
          BASELINE_VAPID_KEYS: ${{ secrets.BASELINE_VAPID_KEYS }}
        run: |
          $WRANGLER d1 execute baseline --remote --json --command "SELECT id, data, updated_at FROM push_subscriptions" > out/subscriptions.json
          node scripts/send-alerts-cloudflare.mjs out/subscriptions.json .data/baseline-monitor.json out/alerts.sql
          $WRANGLER d1 execute baseline --remote --file out/alerts.sql
      - name: Summarize
        if: always()
        run: test -f .data/baseline-monitor.json && node scripts/summarize-check.mjs .data/baseline-monitor.json >> "$GITHUB_STEP_SUMMARY" || true
