services:
  baseline_ui:
    image: __IMAGE__
    pull_policy: always
    network_mode: host
    restart: unless-stopped
    volumes:
      - /mnt/pool0/apps/baseline/direct-data:/app/.data
      - /mnt/pool0/apps/baseline/direct-wrangler:/app/.wrangler
    # Listens on loopback only. Everything reaches it through baseline_relay,
    # which decides who is an admin and who is public.
    command: ["npm", "run", "start:loopback", "--", "--port", "4601"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4601/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  baseline_relay:
    image: __IMAGE__
    pull_policy: always
    network_mode: host
    restart: unless-stopped
    depends_on:
      - baseline_ui
    entrypoint: ["/bin/sh", "-c"]
    environment:
      BASELINE_UPSTREAM_HOST: "127.0.0.1"
      BASELINE_UPSTREAM_PORT: "4601"
      BASELINE_RELAY_PORT: "4600"
      BASELINE_CALLBACK_PORT: "4602"
      # Cloudflare Access verification. Fill both in from the Access application
      # in the Cloudflare Zero Trust dashboard (team domain such as
      # "myteam.cloudflareaccess.com", and the application's Audience tag).
      # While either is empty, admin actions work only from the local network.
      CF_ACCESS_TEAM_DOMAIN: "lively-credit-1a2e.cloudflareaccess.com"
      CF_ACCESS_AUD: "f9e0a71b302291da27aeae2bebf05f77559d446f5a7b034bac0cc5f324c0cfbe"
    volumes:
      - /mnt/pool0/apps/baseline/direct-data:/app/.data
    command: ["sleep 8; exec node /app/scripts/baseline-relay.mjs"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4600/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  baseline_tunnel:
    # Pin an exact version here once you have chosen one. "missing" stops a
    # restart from silently pulling a new release.
    image: cloudflare/cloudflared:latest
    pull_policy: missing
    network_mode: host
    restart: unless-stopped
    depends_on:
      - baseline_relay
    volumes:
      - /mnt/pool0/apps/baseline/direct-data/cloudflare-tunnel-token:/run/secrets/cloudflare-tunnel-token:ro
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/secrets/cloudflare-tunnel-token"]

  tailscale_routes:
    # Security note: mounting the Docker socket gives this container full control
    # of Docker on the NAS. It is only needed to run the two "tailscale serve /
    # funnel" commands below. Those settings persist inside the Tailscale app, so
    # once they are applied you can stop and remove this service.
    image: docker:27-cli
    network_mode: host
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/pool0/apps/baseline:/mnt/pool0/apps/baseline
    command:
      - >-
        until wget -q -O /dev/null http://127.0.0.1:4600/; do sleep 2; done;
        docker exec ix-tailscale-tailscale-1 tailscale funnel --https=443 off >/dev/null 2>&1 || true;
        docker exec ix-tailscale-tailscale-1 tailscale serve --https=8443 off >/dev/null 2>&1 || true;
        docker exec ix-tailscale-tailscale-1 tailscale serve --bg --https=443 http://127.0.0.1:4600 >/mnt/pool0/apps/baseline/direct-data/tailscale-route.log 2>&1;
        docker exec ix-tailscale-tailscale-1 tailscale funnel --bg --https=8443 http://127.0.0.1:4602 >>/mnt/pool0/apps/baseline/direct-data/tailscale-route.log 2>&1;
        sleep infinity
