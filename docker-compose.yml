services:
  baseline:
    build: .
    container_name: baseline-racquet-tracker
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - baseline-wrangler:/app/.wrangler
      - baseline-data:/app/.data

  baseline-monitor:
    build: .
    container_name: baseline-racquet-monitor
    restart: unless-stopped
    depends_on:
      - baseline
    volumes:
      - baseline-wrangler:/app/.wrangler
      - baseline-data:/app/.data
    environment:
      BASELINE_URL: http://baseline:3000
    entrypoint: ["/bin/sh", "-c"]
    command: ["while ! wget -q -O- http://baseline:3000/api/tracker >/dev/null 2>&1; do sleep 5; done; while true; do npm run monitor || true; sleep 10800; done"]

volumes:
  baseline-wrangler:
  baseline-data:
