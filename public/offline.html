<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#10251d" />
    <title>Baseline is offline</title>
    <style>
      :root { color-scheme: light dark; font-family: "Segoe UI", Arial, sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100dvh; display: grid; place-items: center; margin: 0; padding: 28px; background: #f4f1e8; color: #10251d; }
      main { width: min(430px,100%); padding: 34px; border: 1px solid rgba(16,37,29,.16); border-radius: 26px; background: #fffdf8; box-shadow: 0 22px 60px rgba(16,37,29,.12); }
      img { width: 58px; height: 58px; border-radius: 14px; }
      small { display: block; margin-top: 24px; color: #65746d; font-size: .7rem; font-weight: 800; letter-spacing: .12em; }
      h1 { margin: 13px 0 12px; font-size: 2.25rem; line-height: 1; letter-spacing: -.055em; }
      p { margin: 0 0 24px; color: #65746d; font-size: .92rem; line-height: 1.55; }
      button { width: 100%; border: 0; border-radius: 999px; padding: 14px 18px; background: #10251d; color: #f4f1e8; font: inherit; font-weight: 800; cursor: pointer; }
      @media (prefers-color-scheme: dark) { body { background: #14262c; color: #f4f5f2; } main { border-color: #526870; background: #1e343c; } p, small { color: #cbd4d8; } button { background: #dff05a; color: #10251d; } }
    </style>
  </head>
  <body>
    <main>
      <img src="/app-icon-192.png" alt="" />
      <small>BASELINE · OFFLINE</small>
      <h1>The court is temporarily closed.</h1>
      <p>Live prices need a connection. Reconnect to Wi-Fi or cellular data—and to Tailscale while Baseline remains private—then try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
